<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Pricing Calculator — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f0e9; --surface: #fcfbf8; --ink: #201e1a; --ink-muted: #6e6a5f;
    --accent: #35505c; --accent-ink: #f3f0e9; --line: #e2ddd0; --danger: #a8402c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#18191a; --surface:#212325; --ink:#ede9e0; --ink-muted:#9c978a; --accent:#86aebc; --accent-ink:#14181a; --line:#34373a; --danger:#d97a63; }
  }
  :root[data-theme="dark"] { --paper:#18191a; --surface:#212325; --ink:#ede9e0; --ink-muted:#9c978a; --accent:#86aebc; --accent-ink:#14181a; --line:#34373a; --danger:#d97a63; }
  :root[data-theme="light"] { --paper:#f3f0e9; --surface:#fcfbf8; --ink:#201e1a; --ink-muted:#6e6a5f; --accent:#35505c; --accent-ink:#f3f0e9; --line:#e2ddd0; --danger:#a8402c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
         background: var(--paper); color: var(--ink); }
  form { background: var(--surface); border: 1px solid var(--line); border-radius: 3px;
         padding: 32px; width: 320px; max-width: 90vw; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 1.5rem; margin: 0 0 20px; }
  input[type="password"] {
    width: 100%; padding: 10px 11px; border-radius: 3px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-size: 0.95rem; font-family: inherit;
  }
  input[type="password"]:focus { border-color: var(--accent); outline: none; }
  button {
    margin-top: 16px; width: 100%; padding: 10px 18px; border: 1px solid var(--accent); border-radius: 3px;
    background: var(--accent); color: var(--accent-ink); font-size: 0.92rem; font-family: inherit;
    font-weight: 500; cursor: pointer; transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: var(--danger); margin-top: 12px; font-size: 0.85rem; }
</style>
</head>
<body>
<form method="post">
  <h1>Studio Pricing Calculator</h1>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Enter</button>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</form>
</body>
</html>
