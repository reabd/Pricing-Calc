<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Pricing Calculator — Login</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --text: #1a1a1a; --muted: #666;
    --border: #e0e0e0; --accent: #2f6f4f; --accent-dark: #244; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15171a; --panel:#1e2124; --text:#eee; --muted:#9aa0a6; --border:#33383d; --accent:#5fbf8f; --accent-dark:#8fe0b8; --danger:#ff6b60; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
         background: var(--bg); color: var(--text); }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
         padding: 28px; width: 320px; max-width: 90vw; }
  h1 { font-size: 1.15rem; margin: 0 0 18px; }
  input[type="password"] { width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
             background: var(--bg); color: var(--text); font-size: 0.95rem; }
  button { margin-top: 14px; width: 100%; padding: 9px 18px; border: none; border-radius: 8px;
                   background: var(--accent); color: #fff; font-size: 0.95rem; cursor: pointer; }
  button:hover { background: var(--accent-dark); }
  .error { color: var(--danger); margin-top: 10px; font-size: 0.85rem; }
</style>
</head>
<body>
<form method="post">
  <h1>Studio Pricing Calculator</h1>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <button type="submit">Enter</button>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</form>
</body>
</html>
